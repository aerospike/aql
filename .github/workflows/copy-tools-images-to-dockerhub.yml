name: Copy aerospike-aql images to Docker Hub

# Copies already-published aerospike-aql tags from JFrog to Docker Hub.
# Does not build images and does not write anything back to Artifactory.
# Tags: 9.2.9-3 (multi-arch index), 9.2.9-3-amd64 (linux/amd64),
# 9.2.9-3-arm64 (linux/arm64).

on:
  workflow_dispatch:
    inputs:
      source-image:
        description: Source image without tag
        required: true
        default: artifact.aerospike.io/docker/aerospike-aql
      dest-image:
        description: Destination Docker Hub image without tag
        required: true
        default: aerospike/aerospike-aql
      tags:
        description: Comma-separated tags to copy unchanged (index, linux/amd64, linux/arm64)
        required: true
        default: 9.2.9-3,9.2.9-3-amd64,9.2.9-3-arm64
      dry-run:
        description: Inspect JFrog tags only; do not push to Docker Hub
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  copy-to-dockerhub:
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-copy-hub.yaml@feat/docker-copy-hub
    with:
      source-image: ${{ inputs.source-image }}
      dest-image: ${{ inputs.dest-image }}
      tags: ${{ inputs.tags }}
      dry-run: ${{ inputs.dry-run }}
      jf-project: database
      oidc-provider-name: database-gh-aerospike
      oidc-audience: database-gh-aerospike
    secrets:
      dockerhub-username: ${{ vars.AEROSPIKE_DOCKER_ORG_NAME || 'aerospike' }}
      dockerhub-token: ${{ secrets.AEROSPIKE_DOCKER_ORG_RW_TOKEN }}
